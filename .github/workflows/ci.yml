name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de imagen Docker
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/lab5-2:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/lab5-2:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/lab5-2:latest

      - name: Escaneo de vulnerabilidades
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/lab5-2:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push imagen SHA
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/lab5-2:${{ github.sha }}

      - name: Push imagen latest
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/lab5-2:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/lab5-2:latest

            docker stop lab5-2 || true
            docker rm lab5-2 || true

            docker run -d \
              --name lab5-2 \
              --restart unless-stopped \
              -p 80:3000 \
              ${{ secrets.DOCKER_USERNAME }}/lab5-2:latest